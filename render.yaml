services:
  - type: web
    name: opaque
    runtime: node
    plan: free
    buildCommand: "echo 'no build step — zero dependencies'"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
    # NOTE: Render's free plan has NO persistent disk. The SQLite database
    # (server/opaque.db) will be wiped whenever this service redeploys or
    # restarts (including automatic spin-down after 15 minutes of
    # inactivity). Fine for a demo; for real accounts that need to survive,
    # either upgrade to a paid plan and attach a Render Disk, or host on a
    # persistent VM instead — see server/DEPLOY_ORACLE.md.
    # disk:
    #   name: opaque-data
    #   mountPath: /opt/render/project/src/server
    #   sizeGB: 1
